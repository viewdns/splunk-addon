[ViewDNS - Purge expired cache]
description = Removes expired entries from the ViewDNS KV store cache. Runs daily.
search = | inputlookup viewdns_cache_lookup | eval _vd_now=now() | where expires_at > _vd_now | fields - _vd_now | outputlookup viewdns_cache_lookup
cron_schedule = 17 3 * * *
enableSched = 1
dispatch.earliest_time = -1m
dispatch.latest_time = now
is_visible = true
