[viewdns-command]
syntax = viewdns action=(abuselookup|chinesefirewall|dnsrecord|dnssec|freeemail|httpheaders|iphistory|iplocation|iranfirewall|maclookup|ping|portscan|propagation|reversedns|reverseip|reversemx|reversens|reversewhois|spamdblookup|subdomains|traceroute|whois) field=<field> (recordtype=<string>)? (limit=<int>)? (output=(mv|rows))? (cache=<bool>)? (prefix=<string>)?
shortdesc = Enriches events with ViewDNS.info DNS, IP and WHOIS lookups.
description = Looks up each value of the given field with the ViewDNS.info API and adds the results as viewdns_* fields. \
  Lookups are deduplicated within the search and cached in the KV store (default 24 hours), so each distinct value \
  costs at most one API query per cache period. output=mv (default) adds multivalue fields to each event; \
  output=rows returns one event per result. recordtype applies to action=dnsrecord only (default ANY). \
  limit caps the results kept per value (default and maximum: Max results per lookup on the Configuration page). \
  cache=false skips reading the cache. prefix changes the output field prefix, to chain several lookups. \
  Live checks (ping, portscan, traceroute, httpheaders, propagation, chinesefirewall, iranfirewall) make ViewDNS \
  contact the target and are cached for at most 1 hour.
comment1 = Find the other domains hosted on each destination IP.
example1 = index=proxy | stats count by dest_ip | viewdns action=reverseip field=dest_ip
comment2 = One row per historical IP address of each domain.
example2 = | makeresults | eval domain="example.com" | viewdns action=iphistory field=domain output=rows
comment3 = WHOIS for the IPs a domain has used, chaining two lookups with a second prefix.
example3 = | makeresults | eval domain="example.com" | viewdns action=iphistory field=domain output=rows | viewdns action=whois field=viewdns_ip prefix=ipwhois_
comment5 = Known subdomains of a domain, one row each, with their current IPs.
example5 = | makeresults | eval domain="example.com" | viewdns action=subdomains field=domain output=rows
comment6 = Location, reverse DNS and spam blacklist status of each source IP.
example6 = index=firewall | stats count by src_ip | viewdns action=iplocation field=src_ip | viewdns action=spamdblookup field=src_ip prefix=spam_
comment7 = Manufacturer of each MAC address.
example7 = index=dhcp | stats count by src_mac | viewdns action=maclookup field=src_mac
comment4 = MX records of each sender domain.
example4 = index=email | stats count by src_domain | viewdns action=dnsrecord field=src_domain recordtype=MX
usage = public
related = lookup
tags = viewdns dns whois reverse ip subdomains geolocation blacklist portscan traceroute ping mac enrichment threat intelligence

[viewdnsaccount-command]
syntax = viewdnsaccount
shortdesc = Shows ViewDNS API plan usage and remaining queries.
description = Returns the ViewDNS API plan, monthly limit and usage, and the prepaid query balance. Does not consume an API query.
example1 = | viewdnsaccount
usage = public
tags = viewdns credits balance quota
