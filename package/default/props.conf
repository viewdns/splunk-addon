# Events written by the ViewDNS Enrichment alert action. The alert writes spool files named
# *.stash_viewdns_enrichment (Splunk's stash format: a ***SPLUNK*** header line, then events separated by the
# stash breaker), which the default batch input on $SPLUNK_HOME/var/spool/splunk picks up on the search head.
[source::...stash_viewdns_enrichment]
sourcetype = viewdns:enrichment

[viewdns:enrichment]
# -- index time (parsed on the search head that ran the alert) --
HEADER_MODE = firstline
SHOULD_LINEMERGE = false
BREAK_ONLY_BEFORE_DATE = false
LINE_BREAKER = (\r?\n==##~~##~~  1E8N3D4E6V5E7N2T9 ~~##~~##==\r?\n)
TRUNCATE = 0
TIME_PREFIX = ^\{"time":
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
MAX_DAYS_HENCE = 2
LEARN_MODEL = false
category = Custom
description = ViewDNS.info DNS, IP and WHOIS enrichment results (ViewDNS Enrichment alert action)
pulldown_type = false

# -- search time --
KV_MODE = json
# JSON arrays are extracted as "<name>{}"; expose them under their plain names.
EVAL-domain = case(lookup="whois" AND whois_type="domain", query, isnotnull('domain{}'), 'domain{}', true(), domain)
EVAL-last_resolved = coalesce('last_resolved{}', last_resolved)
EVAL-subdomain = coalesce('subdomain{}', subdomain)
# Each value is the space-separated list of IPs of the subdomain at the same position.
EVAL-subdomain_ips = coalesce('subdomain_ips{}', subdomain_ips)
EVAL-created = coalesce('created{}', created)
EVAL-registrar = coalesce('registrar{}', registrar)
EVAL-ip = coalesce('ip{}', ip)
EVAL-location = coalesce('location{}', location)
EVAL-owner = coalesce('owner{}', owner)
EVAL-last_seen = coalesce('last_seen{}', last_seen)
EVAL-record_name = coalesce('record_name{}', record_name)
EVAL-record_type = coalesce('record_type{}', record_type)
EVAL-record_ttl = coalesce('record_ttl{}', record_ttl)
EVAL-record_priority = coalesce('record_priority{}', record_priority)
EVAL-record_data = coalesce('record_data{}', record_data)
EVAL-nameserver = coalesce('nameserver{}', nameserver)
EVAL-domain_status = coalesce('domain_status{}', domain_status)
EVAL-blacklist = coalesce('blacklist{}', blacklist)
EVAL-blacklist_result = coalesce('blacklist_result{}', blacklist_result)
EVAL-header_name = coalesce('header_name{}', header_name)
EVAL-header_value = coalesce('header_value{}', header_value)
EVAL-port = coalesce('port{}', port)
EVAL-service = coalesce('service{}', service)
EVAL-port_status = coalesce('port_status{}', port_status)
EVAL-ping_region = coalesce('ping_region{}', ping_region)
EVAL-ping_location = coalesce('ping_location{}', ping_location)
EVAL-ping_ip = coalesce('ping_ip{}', ping_ip)
EVAL-ping_min_rtt = coalesce('ping_min_rtt{}', ping_min_rtt)
EVAL-ping_avg_rtt = coalesce('ping_avg_rtt{}', ping_avg_rtt)
EVAL-ping_max_rtt = coalesce('ping_max_rtt{}', ping_max_rtt)
EVAL-ping_packet_loss = coalesce('ping_packet_loss{}', ping_packet_loss)
EVAL-hop = coalesce('hop{}', hop)
EVAL-hop_hostname = coalesce('hop_hostname{}', hop_hostname)
EVAL-hop_ip = coalesce('hop_ip{}', hop_ip)
EVAL-hop_rtt = coalesce('hop_rtt{}', hop_rtt)
EVAL-server_location = coalesce('server_location{}', server_location)
EVAL-server_result = coalesce('server_result{}', server_result)
EVAL-server_status = coalesce('server_status{}', server_status)
EVAL-dnssec_signature_type = coalesce('dnssec_signature_type{}', dnssec_signature_type)
EVAL-dnssec_algorithm = coalesce('dnssec_algorithm{}', dnssec_algorithm)
EVAL-dnssec_signed_by = coalesce('dnssec_signed_by{}', dnssec_signed_by)
# CIM-friendly names. dest is the looked-up host for host-based lookups; WHOIS fields also use the names
# Enterprise Security's domain analysis expects (created/updated/expires/registrar/nameservers).
EVAL-dest = if(in(lookup, "reversewhois", "maclookup", "freeemail"), null(), query)
EVAL-dest_mac = if(lookup="maclookup", query, null())
EVAL-src_user = if(lookup="reversewhois", query, null())
EVAL-dest_ip = case(lookup="iphistory", coalesce('ip{}', ip), lookup="whois" AND whois_type="ip", query, in(lookup, "iplocation", "reversedns", "spamdblookup"), query, true(), null())
EVAL-dest_port = if(lookup="portscan", coalesce('port{}', port), null())
EVAL-nameservers = if(lookup="whois", coalesce('nameserver{}', nameserver), null())
EVAL-answer = if(lookup="dnsrecord", coalesce('record_data{}', record_data), null())
