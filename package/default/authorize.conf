# Running ViewDNS lookups (viewdns, viewdnsaccount, the ViewDNS Enrichment alert action) requires the
# viewdns_lookup capability. It only allows calling the add-on's lookup endpoint; it does not expose the API key or
# any other stored credential.
[capability::viewdns_lookup]

[role_viewdns_user]
importRoles = user
viewdns_lookup = enabled

[role_admin]
viewdns_lookup = enabled
