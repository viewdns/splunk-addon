# Local Splunk for installing and testing the built TA-viewdns package.
#   1. scripts/build.sh                      (creates dist/TA-viewdns-<version>.tar.gz)
#   2. cp .env.example .env and set SPLUNK_PASSWORD
#   3. docker compose up -d                  (first start takes a few minutes)
#   4. open http://localhost:8000 (admin / $SPLUNK_PASSWORD)
# Optional second instance on Splunk 10.6 (Python 3.13), http://localhost:18000:
#   docker compose --profile splunk10 up -d splunk10
services:
  splunk:
    image: splunk/splunk:${SPLUNK_VERSION:-9.4}
    container_name: viewdns-splunk
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
      SPLUNK_APPS_URL: /tmp/dist/TA-viewdns-${TA_VERSION:-1.0.0}.tar.gz
    ports:
      - "8000:8000"   # Splunk Web
      - "8089:8089"   # REST API (used by tests/smoke/splunk_smoke.sh)
    volumes:
      - ./dist:/tmp/dist:ro
      - splunk-var:/opt/splunk/var
      - splunk-etc:/opt/splunk/etc
    # The splunk/splunk image ships its own HEALTHCHECK.

  splunk10:
    profiles: ["splunk10"]
    image: splunk/splunk:${SPLUNK10_VERSION:-10.6.1}
    container_name: viewdns-splunk10
    platform: linux/amd64
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_GENERAL_TERMS: --accept-sgt-current-at-splunk-com
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?Set SPLUNK_PASSWORD in .env}
      SPLUNK_APPS_URL: /tmp/dist/TA-viewdns-${TA_VERSION:-1.0.0}.tar.gz
    ports:
      - "18000:8000"
      - "18089:8089"
    volumes:
      - ./dist:/tmp/dist:ro
      - splunk10-var:/opt/splunk/var
      - splunk10-etc:/opt/splunk/etc

volumes:
  splunk-var:
  splunk-etc:
  splunk10-var:
  splunk10-etc:
